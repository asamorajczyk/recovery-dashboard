<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Med Tracker</title>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0e0f11;
      --surface: #161719;
      --surface2: #1e2023;
      --border: #2a2d32;
      --border-bright: #3a3f47;
      --ink: #e8eaed;
      --muted: #6b7280;
      --accent: #e05c1a;
      --accent-dim: #7a2f08;
      --green: #22c55e;
      --green-dim: #14532d;
      --yellow: #f59e0b;
      --red: #ef4444;
    }

    body {
      font-family: 'Rajdhani', sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      padding: 24px 16px;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        repeating-linear-gradient(0deg, transparent, transparent 39px, rgba(255,255,255,0.015) 39px, rgba(255,255,255,0.015) 40px),
        repeating-linear-gradient(90deg, transparent, transparent 39px, rgba(255,255,255,0.015) 39px, rgba(255,255,255,0.015) 40px);
      pointer-events: none;
      z-index: 0;
    }

    .panel {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 460px;
      margin: 0 auto;
    }

    /* Header */
    .header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    .header-left h1 {
      font-weight: 700;
      font-size: 30px;
      letter-spacing: 3px;
      text-transform: uppercase;
      line-height: 1;
    }

    .header-left h1 span { color: var(--accent); }

    .header-left p {
      margin-top: 4px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    .back-link {
      font-family: 'Share Tech Mono', monospace;
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 0.1em;
      text-decoration: none;
      text-transform: uppercase;
    }
    .back-link:active { color: var(--ink); }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }

    /* Separator */
    .sep {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }

    .sep-line { flex: 1; height: 1px; background: var(--border); }

    .sep span {
      font-family: 'Share Tech Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.2em;
      color: var(--border-bright);
      text-transform: uppercase;
    }

    /* Med Cards */
    .med-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      border-radius: 2px;
      padding: 14px 16px;
      margin-bottom: 10px;
      display: flex;
      flex-direction: column;
      transition: background 0.3s, box-shadow 0.3s;
    }

    .med-card-inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .med-card.card-due {
      background: rgba(224, 92, 26, 0.07);
      border-color: var(--accent-dim);
      box-shadow: 0 0 0 1px var(--accent-dim), inset 0 0 20px rgba(224, 92, 26, 0.04);
      animation: card-pulse 2s ease-in-out infinite;
    }

    @keyframes card-pulse {
      0%, 100% { box-shadow: 0 0 0 1px var(--accent-dim), inset 0 0 20px rgba(224, 92, 26, 0.04); }
      50%       { box-shadow: 0 0 0 1px var(--accent), inset 0 0 20px rgba(224, 92, 26, 0.08); }
    }

    .med-name {
      font-weight: 700;
      font-size: 16px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      line-height: 1;
    }

    .med-dose {
      font-family: 'Share Tech Mono', monospace;
      font-size: 11px;
      color: var(--muted);
      margin-top: 4px;
    }

    .med-notes {
      font-family: 'Share Tech Mono', monospace;
      font-size: 10px;
      color: var(--muted);
      margin-top: 4px;
      font-style: italic;
    }

    .med-last {
      font-family: 'Share Tech Mono', monospace;
      font-size: 10px;
      color: var(--border-bright);
      margin-top: 5px;
    }

    .med-status {
      flex-shrink: 0;
      font-family: 'Share Tech Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.08em;
      color: var(--muted);
      text-align: right;
    }

    .med-status.due {
      color: var(--accent);
      font-weight: 700;
      font-size: 12px;
      animation: pulse 1.5s ease-in-out infinite;
    }

    .med-status.soon { color: var(--yellow); }
    .med-status.as-needed { color: var(--muted); font-size: 10px; letter-spacing: 0.15em; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.5; }
    }

    /* Log buttons */
    .med-card-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
      flex-shrink: 0;
    }

    .log-btn-group {
      display: flex;
      gap: 4px;
    }

    .log-btn {
      background: none;
      border: 1px solid var(--border-bright);
      border-radius: 2px;
      color: var(--muted);
      font-family: 'Share Tech Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 5px 10px;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
      white-space: nowrap;
    }

    .log-btn:hover:not(:disabled) {
      border-color: var(--accent);
      color: var(--accent);
    }

    .log-btn:active:not(:disabled) { transform: scale(0.97); }

    .log-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .log-btn.success {
      border-color: var(--green);
      color: var(--green);
    }

    .log-btn.warn {
      border-color: var(--yellow);
      color: var(--yellow);
    }

    .log-past-btn {
      background: none;
      border: 1px solid var(--border);
      border-radius: 2px;
      color: var(--border-bright);
      font-family: 'Share Tech Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 5px 8px;
      cursor: pointer;
      white-space: nowrap;
      transition: border-color 0.15s, color 0.15s;
    }

    .log-past-btn:hover:not(:disabled) {
      border-color: var(--muted);
      color: var(--muted);
    }

    .log-past-btn:active:not(:disabled) { transform: scale(0.97); }

    .log-past-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    /* Custom time panel */
    .custom-log-panel {
      display: none;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
    }

    .custom-row {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .custom-log-panel input[type="datetime-local"] {
      flex: 1;
      min-width: 0;
      background: var(--bg);
      border: 1px solid var(--border-bright);
      border-radius: 2px;
      color: var(--ink);
      font-family: 'Share Tech Mono', monospace;
      font-size: 11px;
      padding: 5px 8px;
      outline: none;
    }

    .custom-log-panel input[type="datetime-local"]:focus {
      border-color: var(--accent);
    }

    .custom-log-panel input[type="datetime-local"]::-webkit-calendar-picker-indicator {
      filter: invert(0.6);
      cursor: pointer;
    }

    .confirm-log-btn {
      background: none;
      border: 1px solid var(--accent-dim);
      border-radius: 2px;
      color: var(--accent);
      font-family: 'Share Tech Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 5px 10px;
      cursor: pointer;
      white-space: nowrap;
      transition: border-color 0.15s, color 0.15s;
    }

    .confirm-log-btn:hover:not(:disabled) {
      border-color: var(--accent);
    }

    .confirm-log-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .confirm-log-btn.success {
      border-color: var(--green);
      color: var(--green);
    }

    .custom-cancel {
      display: block;
      margin-top: 6px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.1em;
      color: var(--muted);
      cursor: pointer;
      text-align: right;
      text-decoration: underline;
    }

    /* Footer */
    .footer {
      margin-top: 20px;
      display: flex;
      justify-content: space-between;
      font-family: 'Share Tech Mono', monospace;
      font-size: 9px;
      color: var(--border-bright);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .error-msg {
      font-family: 'Share Tech Mono', monospace;
      font-size: 12px;
      color: var(--accent);
      text-align: center;
      padding: 32px 0;
    }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--surface2);
      border: 1px solid var(--border-bright);
      border-radius: 2px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.06em;
      padding: 10px 18px;
      color: var(--ink);
      white-space: nowrap;
      z-index: 100;
      opacity: 0;
      transition: opacity 0.2s;
      pointer-events: none;
    }

    .toast.show { opacity: 1; }
    .toast.toast-ok   { border-color: var(--green);  color: var(--green); }
    .toast.toast-err  { border-color: var(--accent);  color: var(--accent); }
    .toast.toast-warn { border-color: var(--yellow);  color: var(--yellow); }
  </style>
</head>
<body>
  <div class="panel">

    <div class="header">
      <div class="header-left">
        <h1>MED <span>TRACKER</span></h1>
        <p>Medication status</p>
      </div>
      <a class="back-link" href="../dashboard/index.html">&#9664; return to dashboard</a>
    </div>

    <div class="sep">
      <div class="sep-line"></div>
      <span>Medications</span>
      <div class="sep-line"></div>
    </div>

    <div id="med-list"></div>

    <div class="footer">
      <span id="footer-time">—</span>
      <span>auto-refresh 5m</span>
    </div>

  </div>

  <div class="toast" id="toast"></div>

  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzlX9lSgCYNm4qc1pYUEz-VWnjVSoCjhAgXCLPbKyMG4RbwyT7fn-Ks0xGf6JHF-8lc/exec';

    let meds         = [];
    let todayLog     = [];
    let lastDosesMap = {};
    let tickInterval = null;

    function parseTs(ts) {
      return new Date(String(ts).replace(' ', 'T'));
    }

    function toLocalInputValue(date) {
      const pad = n => String(n).padStart(2, '0');
      return `${date.getFullYear()}-${pad(date.getMonth()+1)}-${pad(date.getDate())}T${pad(date.getHours())}:${pad(date.getMinutes())}`;
    }

    async function loadData() {
      try {
        const t = Date.now();
        const [medsRes, logRes, lastDosesRes] = await Promise.all([
          fetch(`${SCRIPT_URL}?action=getMeds&_=${t}`),
          fetch(`${SCRIPT_URL}?action=getTodayLog&_=${t}`),
          fetch(`${SCRIPT_URL}?action=getLastDoses&_=${t}`)
        ]);

        meds         = await medsRes.json();
        todayLog     = await logRes.json();
        lastDosesMap = await lastDosesRes.json();

        render();
      } catch (err) {
        document.getElementById('med-list').innerHTML =
          `<div class="error-msg">// ERR: could not load data — check connection</div>`;
      }
    }

    function lastDoseFor(medId) {
      const todayEntry = todayLog
        .filter(e => e.med_id === medId)
        .sort((a, b) => parseTs(b.timestamp) - parseTs(a.timestamp))[0];
      if (todayEntry) return todayEntry;
      const ts = lastDosesMap[medId];
      return ts ? { timestamp: ts, med_id: medId } : null;
    }

    function timeAgo(timestamp) {
      const d = parseTs(timestamp);
      if (isNaN(d)) return '—';
      const mins = Math.max(0, Math.floor((Date.now() - d) / 60000));
      if (mins < 1) return 'just now';
      const h = Math.floor(mins / 60);
      const m = mins % 60;
      return h > 0 ? `${h}h ${m}m ago` : `${mins}m ago`;
    }

    function msRemaining(lastDose, intervalHours) {
      if (!lastDose) return null;
      const t = parseTs(lastDose.timestamp).getTime();
      if (isNaN(t)) return null;
      return t + intervalHours * 3_600_000 - Date.now();
    }

    function formatCountdown(ms) {
      if (ms <= 0) return 'DUE NOW';
      const h = Math.floor(ms / 3_600_000);
      const m = Math.floor((ms % 3_600_000) / 60000);
      return `${h}h ${String(m).padStart(2, '0')}m`;
    }

    function renderCard(med, list) {
      const last = lastDoseFor(med.id);
      const card = document.createElement('div');

      const logBtns = `
        <div class="log-btn-group">
          <button class="log-btn" data-med-id="${med.id}" onclick="manualLog('${med.id}', this)">+ LOG</button>
          <button class="log-past-btn" onclick="toggleCustomLog('${med.id}')">PAST</button>
        </div>`;

      const customPanel = `
        <div class="custom-log-panel" id="cpanel-${med.id}">
          <div class="custom-row">
            <input type="datetime-local" id="ctime-${med.id}" />
            <button class="confirm-log-btn" onclick="doLogCustom('${med.id}')">OK</button>
          </div>
          <span class="custom-cancel" onclick="toggleCustomLog('${med.id}')">&#8592; cancel</span>
        </div>`;

      const lastLine = last ? `<div class="med-last" data-timestamp="${last.timestamp}">last dose: ${timeAgo(last.timestamp)}</div>` : '';
      const notesLine = med.notes ? `<div class="med-notes">${med.notes}</div>` : '';

      if (med.as_needed) {
        card.className = 'med-card';
        card.style.borderLeftColor = med.color;
        card.innerHTML = `
          <div class="med-card-inner">
            <div class="med-info">
              <div class="med-name">${med.name}</div>
              <div class="med-dose">${med.dose}</div>
              ${notesLine}
              ${lastLine}
            </div>
            <div class="med-card-right">
              <div class="med-status as-needed">AS NEEDED</div>
              ${logBtns}
            </div>
          </div>
          ${customPanel}`;
        list.appendChild(card);
        return;
      }

      const remaining = msRemaining(last, med.interval_hours);
      const isDue     = remaining === null || remaining <= 0;

      let statusClass = '';
      let statusText  = '— not taken today';

      if (remaining !== null) {
        if (remaining <= 0) {
          statusClass = 'due';
          statusText  = 'DUE NOW';
        } else if (remaining < 3_600_000) {
          statusClass = 'soon';
          statusText  = formatCountdown(remaining);
        } else {
          statusText = formatCountdown(remaining);
        }
      } else {
        statusClass = 'due';
        statusText  = 'DUE NOW';
      }

      card.className = 'med-card' + (isDue ? ' card-due' : '');
      card.style.borderLeftColor = isDue ? 'var(--accent)' : med.color;
      card.innerHTML = `
        <div class="med-card-inner">
          <div class="med-info">
            <div class="med-name">${med.name}</div>
            <div class="med-dose">${med.dose}</div>
            ${notesLine}
            ${lastLine}
          </div>
          <div class="med-card-right">
            <div class="med-status ${statusClass}" data-med-id="${med.id}">${statusText}</div>
            ${logBtns}
          </div>
        </div>
        ${customPanel}`;
      list.appendChild(card);
    }

    function makeSep(label) {
      const sep = document.createElement('div');
      sep.className = 'sep';
      sep.innerHTML = `<div class="sep-line"></div><span>${label}</span><div class="sep-line"></div>`;
      return sep;
    }

    function render() {
      const list = document.getElementById('med-list');
      list.innerHTML = '';

      const scheduled  = meds.filter(m => !m.as_needed);
      const asNeeded   = meds.filter(m => m.as_needed);

      const dueMeds  = scheduled.filter(m => { const r = msRemaining(lastDoseFor(m.id), m.interval_hours); return r === null || r <= 0; });
      const soonMeds = scheduled.filter(m => { const r = msRemaining(lastDoseFor(m.id), m.interval_hours); return r !== null && r > 0 && r < 3_600_000; });
      const okMeds   = scheduled.filter(m => { const r = msRemaining(lastDoseFor(m.id), m.interval_hours); return r !== null && r >= 3_600_000; });

      [...dueMeds, ...soonMeds, ...okMeds].forEach(med => renderCard(med, list));

      if (asNeeded.length > 0) {
        if (scheduled.length > 0) list.appendChild(makeSep('As Needed'));
        asNeeded.forEach(med => renderCard(med, list));
      }

      const now = new Date();
      document.getElementById('footer-time').textContent =
        `updated ${now.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }).toLowerCase()}`;

      if (tickInterval) clearInterval(tickInterval);
      tickInterval = setInterval(tick, 60_000);
      checkDueNotifications();
    }

    function tick() {
      document.querySelectorAll('.med-status[data-med-id]').forEach(el => {
        const med  = meds.find(m => m.id === el.dataset.medId);
        if (!med || med.as_needed) return;
        const last      = lastDoseFor(med.id);
        const remaining = msRemaining(last, med.interval_hours);
        if (remaining === null) return;
        if (remaining <= 0) {
          el.className = 'med-status due';
          el.textContent = 'DUE NOW';
        } else if (remaining < 3_600_000) {
          el.className = 'med-status soon';
          el.textContent = formatCountdown(remaining);
        } else {
          el.className = 'med-status';
          el.textContent = formatCountdown(remaining);
        }
      });
      document.querySelectorAll('.med-last[data-timestamp]').forEach(el => {
        el.textContent = 'last dose: ' + timeAgo(el.dataset.timestamp);
      });
      checkDueNotifications();
    }

    let toastTimer = null;

    function showToast(msg, type, duration = 3000) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = `toast show ${type}`;
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { t.className = 'toast'; }, duration);
    }

    function fmtRemaining(ms) {
      const h = Math.floor(ms / 3_600_000);
      const m = Math.floor((ms % 3_600_000) / 60000);
      return h > 0 ? `${h}h ${String(m).padStart(2,'0')}m` : `${m}m`;
    }

    const pendingConfirm = new Map();

    async function manualLog(medId, btn) {
      const med = meds.find(m => m.id === medId);
      if (med && med.as_needed) {
        await submitLog(medId, btn, null);
        return;
      }

      if (pendingConfirm.has(medId)) {
        clearTimeout(pendingConfirm.get(medId));
        pendingConfirm.delete(medId);
        await submitLog(medId, btn, null);
        return;
      }

      btn.disabled = true;
      btn.textContent = '...';

      try {
        const res  = await fetch(`${SCRIPT_URL}?action=getLastDose&medId=${encodeURIComponent(medId)}&_=${Date.now()}`);
        const data = await res.json();

        let tooEarly  = false;
        let remaining = 0;

        if (data.timestamp) {
          const med = meds.find(m => m.id === medId);
          const ts  = String(data.timestamp).replace(' ', 'T');
          remaining = new Date(ts).getTime() + med.interval_hours * 3_600_000 - Date.now();
          if (!isNaN(remaining) && remaining > 30 * 60 * 1000) tooEarly = true;
        }

        if (tooEarly) {
          btn.disabled = false;
          btn.textContent = '⚠ CONFIRM';
          btn.classList.add('warn');
          showToast(
            `// WARN: not due for ${fmtRemaining(remaining)} — tap CONFIRM to log anyway`,
            'toast-warn',
            8000
          );
          const timer = setTimeout(() => {
            if (pendingConfirm.has(medId)) {
              pendingConfirm.delete(medId);
              btn.textContent = '+ LOG';
              btn.classList.remove('warn');
            }
          }, 8000);
          pendingConfirm.set(medId, timer);
        } else {
          await submitLog(medId, btn, null);
        }
      } catch (err) {
        btn.disabled = false;
        btn.textContent = '+ LOG';
        showToast('// ERR: failed to log — tap to retry', 'toast-err');
      }
    }

    async function submitLog(medId, btn, isoTimestamp) {
      const isCustom = !!isoTimestamp;
      btn.disabled = true;
      btn.textContent = '...';
      btn.classList.remove('warn');

      const url = `${SCRIPT_URL}?action=logDose&medId=${encodeURIComponent(medId)}`
        + (isCustom ? `&timestamp=${encodeURIComponent(isoTimestamp)}` : '');

      try {
        const res  = await fetch(url);
        const data = await res.json();
        if (data.error) throw new Error(data.error);

        notifiedMeds.delete(medId);
        btn.textContent = '✓ LOGGED';
        btn.classList.add('success');

        const when = isCustom
          ? new Date(isoTimestamp).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' })
          : new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
        showToast(`// OK: ${data.med} logged at ${when}`, 'toast-ok');

        // Immediately update local state from server's returned timestamp so
        // the display reflects the new dose without waiting for a network roundtrip.
        if (data.timestamp) {
          lastDosesMap[medId] = data.timestamp;
          const todayLocal = new Date().toLocaleDateString('sv-SE'); // "2026-06-02"
          if (data.timestamp.startsWith(todayLocal)) {
            const m = meds.find(m => m.id === medId);
            if (m) todayLog.push({ timestamp: data.timestamp, med_id: medId, med_name: m.name, dose: m.dose, num_pills: m.num_pills });
          }
          render();
        }
        setTimeout(() => loadData(), 3000);
      } catch (err) {
        btn.disabled = false;
        btn.textContent = isCustom ? 'OK' : '+ LOG';
        showToast('// ERR: failed to log — tap to retry', 'toast-err');
      }
    }

    // Kept for backward compatibility (called by manualLog path above)
    async function doLog(medId, btn) {
      await submitLog(medId, btn, null);
    }

    function toggleCustomLog(medId) {
      const panel = document.getElementById(`cpanel-${medId}`);
      if (!panel) return;
      const visible = panel.style.display === 'block';
      if (visible) {
        panel.style.display = 'none';
        const btn = panel.querySelector('.confirm-log-btn');
        if (btn) { btn.disabled = false; btn.textContent = 'OK'; btn.classList.remove('success'); }
      } else {
        const input = document.getElementById(`ctime-${medId}`);
        if (input) input.value = toLocalInputValue(new Date());
        panel.style.display = 'block';
      }
    }

    async function doLogCustom(medId) {
      const input = document.getElementById(`ctime-${medId}`);
      const btn   = document.getElementById(`cpanel-${medId}`).querySelector('.confirm-log-btn');

      if (!input || !input.value) {
        showToast('// ERR: select a date and time first', 'toast-err');
        return;
      }

      const d = new Date(input.value);
      if (isNaN(d.getTime())) {
        showToast('// ERR: invalid date/time', 'toast-err');
        return;
      }

      await submitLog(medId, btn, d.toISOString());
    }

    // --- ntfy notifications ---

    const NTFY_TOPIC = 'Jessies-Recovery-Help-Button-aka-Annoy-Ashley-Button';
    const notifiedMeds = new Set();

    async function sendDueNotification(med) {
      return; // ntfy disabled
      if (notifiedMeds.has(med.id)) return;
      notifiedMeds.add(med.id);
      try {
        await fetch(`https://ntfy.sh/${NTFY_TOPIC}`, {
          method: 'POST',
          headers: {
            'Title': `Med Due: ${med.name}`,
            'Priority': 'high',
            'Tags': 'pill'
          },
          body: `${med.dose} — time to take ${med.name}`
        });
      } catch (_) {
        notifiedMeds.delete(med.id);
      }
    }

    function checkDueNotifications() {
      meds.forEach(med => {
        if (med.as_needed) return;
        const last = lastDoseFor(med.id);
        const remaining = msRemaining(last, med.interval_hours);
        if (remaining === null || remaining <= 0) sendDueNotification(med);
      });
    }

    // --- end ntfy ---

    loadData();
    setInterval(loadData, 300_000);
  </script>
</body>
</html>
