<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cold Therapy</title>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0e0f11;
      --surface: #161719;
      --surface2: #1e2023;
      --border: #2a2d32;
      --border-bright: #3a3f47;
      --ink: #e8eaed;
      --muted: #6b7280;
      --accent: #e05c1a;
      --green: #22c55e;
      --green-dim: #14532d;
      --yellow: #f59e0b;
      --red: #ef4444;
      --ice: #38bdf8;
      --ice-dim: #0c4a6e;
      --ice-glow: rgba(56,189,248,0.15);
    }

    body {
      font-family: 'Rajdhani', sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      padding: 24px 16px 40px;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        repeating-linear-gradient(0deg, transparent, transparent 39px, rgba(255,255,255,0.015) 39px, rgba(255,255,255,0.015) 40px),
        repeating-linear-gradient(90deg, transparent, transparent 39px, rgba(255,255,255,0.015) 39px, rgba(255,255,255,0.015) 40px);
      pointer-events: none;
      z-index: 0;
    }

    .panel {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 460px;
      margin: 0 auto;
    }

    .header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      margin-bottom: 28px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
    }

    .header h1 {
      font-weight: 700;
      font-size: 30px;
      letter-spacing: 3px;
      text-transform: uppercase;
      line-height: 1;
    }

    .header h1 span { color: var(--ice); }

    .header p {
      margin-top: 4px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    .back-link {
      font-family: 'Share Tech Mono', monospace;
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 0.1em;
      text-decoration: none;
      text-transform: uppercase;
    }
    .back-link:active { color: var(--ink); }

    .timer-block {
      background: var(--surface);
      border: 1px solid var(--border);
      border-top: 2px solid var(--ice);
      border-radius: 2px;
      padding: 28px 20px 24px;
      margin-bottom: 12px;
      text-align: center;
      transition: border-top-color 0.3s, box-shadow 0.3s;
    }

    .timer-block.running {
      box-shadow: 0 0 24px rgba(56,189,248,0.12);
      animation: ice-pulse 3s ease-in-out infinite;
    }

    @keyframes ice-pulse {
      0%, 100% { box-shadow: 0 0 16px rgba(56,189,248,0.08); }
      50%       { box-shadow: 0 0 32px rgba(56,189,248,0.2); }
    }

    .timer-status-label {
      font-family: 'Share Tech Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .timer-display {
      font-family: 'Share Tech Mono', monospace;
      font-size: 76px;
      font-weight: 700;
      letter-spacing: 6px;
      color: var(--ice);
      line-height: 1;
      margin-bottom: 8px;
      transition: color 0.3s;
    }

    .timer-display.idle { opacity: 0.6; }

    .timer-sub {
      font-family: 'Share Tech Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .last-ice {
      font-family: 'Share Tech Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.1em;
      color: var(--border-bright);
      margin-top: 6px;
      min-height: 14px;
    }

    #action-btn {
      display: block;
      width: 100%;
      border: none;
      border-radius: 2px;
      font-family: 'Rajdhani', sans-serif;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 4px;
      text-transform: uppercase;
      padding: 20px;
      cursor: pointer;
      min-height: 68px;
      transition: background 0.2s, transform 0.08s;
      -webkit-tap-highlight-color: transparent;
    }

    #action-btn:active { transform: scale(0.99); }

    #action-btn.start { background: var(--ice); color: #0a0a0a; }
    #action-btn.stop  { background: #1e2023; color: var(--accent); border: 1px solid var(--accent); }

    .toast {
      display: none;
      padding: 10px 14px;
      border-radius: 2px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.06em;
      margin-bottom: 12px;
      border: 1px solid transparent;
    }
    .toast.success { display: block; background: rgba(34,197,94,0.08); color: var(--green); border-color: #166534; }
    .toast.error   { display: block; background: rgba(224,92,26,0.08); color: var(--accent); border-color: #7a2f08; }

    .section-label {
      font-family: 'Share Tech Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--border-bright);
      margin-bottom: 10px;
      margin-top: 20px;
    }

    .log-list { display: flex; flex-direction: column; gap: 6px; }

    .log-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 2px;
    }

    .log-time {
      font-family: 'Share Tech Mono', monospace;
      font-size: 11px;
      color: var(--muted);
      flex: 1;
    }

    .log-badge {
      font-family: 'Share Tech Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.06em;
      padding: 3px 8px;
      border-radius: 2px;
    }

    .log-badge.complete { background: rgba(34,197,94,0.1); color: var(--green); }
    .log-badge.stopped  { background: rgba(107,114,128,0.1); color: var(--muted); }

    .log-duration {
      font-family: 'Share Tech Mono', monospace;
      font-size: 11px;
      color: var(--border-bright);
      min-width: 42px;
      text-align: right;
    }

    .no-entries {
      font-family: 'Share Tech Mono', monospace;
      font-size: 11px;
      color: var(--border-bright);
    }

    .session-count {
      font-family: 'Share Tech Mono', monospace;
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 0.1em;
      margin-bottom: 6px;
    }

    .session-count span { color: var(--ice); }

    .footer {
      margin-top: 24px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 9px;
      color: var(--border-bright);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="panel">

    <div class="header">
      <div>
        <h1>COLD <span>THERAPY</span></h1>
        <p>On/off session tracker</p>
      </div>
      <a class="back-link" href="../dashboard/index.html">&#9664; back</a>
    </div>

    <div class="timer-block" id="timer-block">
      <div class="timer-status-label" id="status-label">// ready</div>
      <div class="timer-display idle" id="timer-display">00:00</div>
      <div class="timer-sub" id="timer-sub">tap start to begin</div>
      <div class="last-ice" id="last-ice"></div>
    </div>

    <button id="action-btn" class="start" onclick="handleAction()">&#10052;&nbsp; Start Session</button>

    <div class="toast" id="toast"></div>

    <div class="section-label" id="session-count-label">// today's sessions</div>
    <div class="log-list" id="log-list">
      <div class="no-entries">loading...</div>
    </div>

    <div class="footer" id="footer">—</div>

  </div>

  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzlX9lSgCYNm4qc1pYUEz-VWnjVSoCjhAgXCLPbKyMG4RbwyT7fn-Ks0xGf6JHF-8lc/exec';

    let state    = 'idle';   // idle | running
    let elapsed  = 0;        // seconds elapsed this session
    let tickId   = null;

    function fmtElapsed(s) {
      const h   = Math.floor(s / 3600);
      const m   = Math.floor((s % 3600) / 60);
      const sec = s % 60;
      if (h > 0) {
        return `${h}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
      }
      return `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
    }

    function fmtTime(ts) {
      return new Date(ts).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
    }

    function fmtAgo(ms) {
      const totalMin = Math.floor(ms / 60000);
      if (totalMin < 2)  return 'just now';
      if (totalMin < 60) return `${totalMin}m ago`;
      const h = Math.floor(totalMin / 60);
      const m = totalMin % 60;
      return m === 0 ? `${h}h ago` : `${h}h ${m}m ago`;
    }

    function setDisplay(seconds, cls) {
      const el = document.getElementById('timer-display');
      el.textContent = fmtElapsed(seconds);
      el.className = 'timer-display ' + (cls || '');
    }

    function showToast(msg, type) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = 'toast ' + type;
      if (type === 'success') setTimeout(() => { t.className = 'toast'; }, 5000);
    }

    function tick() {
      elapsed++;
      setDisplay(elapsed, '');
    }

    function transitionRunning() {
      state   = 'running';
      elapsed = 0;

      localStorage.setItem('cold_therapy_session_start', Date.now().toString());

      document.getElementById('timer-block').className    = 'timer-block running';
      document.getElementById('status-label').textContent = '// session active';
      document.getElementById('timer-sub').textContent    = 'machine is running';
      document.getElementById('last-ice').textContent     = '';

      setDisplay(0, '');

      const btn = document.getElementById('action-btn');
      btn.className = 'stop';
      btn.innerHTML = '&#9646;&#9646;&nbsp; Stop Session';

      tickId = setInterval(tick, 1000);
    }

    function transitionStopped() {
      if (tickId) { clearInterval(tickId); tickId = null; }
      localStorage.removeItem('cold_therapy_session_start');
      const dur = elapsed;
      state = 'idle';

      document.getElementById('timer-block').className    = 'timer-block';
      document.getElementById('status-label').textContent = '// ready';
      document.getElementById('timer-sub').textContent    = 'tap start to begin';

      setDisplay(0, 'idle');

      const btn = document.getElementById('action-btn');
      btn.className = 'start';
      btn.innerHTML = '&#10052;&nbsp; Start Session';

      if (dur >= 10) logSession('complete', dur);
    }

    function handleAction() {
      if (state === 'idle') {
        transitionRunning();
      } else if (state === 'running') {
        transitionStopped();
      }
    }

    async function logSession(event, durationSec) {
      try {
        const res  = await fetch(`${SCRIPT_URL}?action=logColdTherapy&event=${event}&duration_sec=${durationSec}`);
        const data = await res.json();
        if (data.error) throw new Error(data.error);
        showToast(`// OK: session logged`, 'success');
      } catch (e) {
        showToast('// ERR: could not log session — saved locally', 'error');
        saveLocalFallback(event, durationSec);
      }
      await loadTodaySessions();
    }

    function saveLocalFallback(event, durationSec) {
      const key  = 'cold_therapy_fallback';
      const list = JSON.parse(localStorage.getItem(key) || '[]');
      list.push({ timestamp: new Date().toISOString(), event, duration_hours: durationSec / 3600 });
      localStorage.setItem(key, JSON.stringify(list));
    }

    async function loadTodaySessions() {
      try {
        const res  = await fetch(`${SCRIPT_URL}?action=getColdTherapyLog`);
        const data = await res.json();
        renderSessionLog(data.sessions || []);
        document.getElementById('footer').textContent =
          `updated ${new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }).toLowerCase()} · logged to google sheet`;
      } catch (e) {
        const local = JSON.parse(localStorage.getItem('cold_therapy_fallback') || '[]');
        const today = new Date().toDateString();
        renderSessionLog(
          local
            .filter(s => new Date(s.timestamp).toDateString() === today)
            .map(s => ({ timestamp: s.timestamp, event: s.event, duration_hours: s.duration_hours }))
        );
      }
    }

    function renderSessionLog(sessions) {
      const list  = document.getElementById('log-list');
      const label = document.getElementById('session-count-label');

      if (sessions.length > 0) {
        const totalHours = sessions.reduce((sum, s) => sum + (s.duration_hours || 0), 0);
        const th = Math.floor(totalHours);
        const tm = Math.round((totalHours - th) * 60);
        const totalStr = th > 0 ? `${th}h ${String(tm).padStart(2,'0')}m` : `${tm}m`;
        label.textContent = `// today's sessions — ${sessions.length} logged · ${totalStr} total`;
      } else {
        label.textContent = '// today\'s sessions';
      }

      const lastIceEl = document.getElementById('last-ice');
      if (sessions.length > 0 && state !== 'running') {
        const latestTs = sessions.reduce((best, s) =>
          new Date(s.timestamp) > new Date(best.timestamp) ? s : best
        ).timestamp;
        lastIceEl.textContent = `last session: ${fmtAgo(Date.now() - new Date(latestTs).getTime())}`;
      } else {
        lastIceEl.textContent = '';
      }

      if (!sessions.length) {
        list.innerHTML = '<div class="no-entries">// no sessions yet today</div>';
        return;
      }

      list.innerHTML = '';
      [...sessions].reverse().forEach(s => {
        const row = document.createElement('div');
        row.className = 'log-row';

        const h = Math.floor(s.duration_hours);
        const m = Math.round((s.duration_hours - h) * 60);
        const durStr = h > 0 ? `${h}h ${String(m).padStart(2,'0')}m` : `${m}m`;

        const isComplete = (s.event || '').toLowerCase() !== 'stopped';
        row.innerHTML = `
          <div class="log-time">${fmtTime(s.timestamp)}</div>
          <div class="log-duration">${durStr}</div>
          <div class="log-badge ${isComplete ? 'complete' : 'stopped'}">${isComplete ? '&#10003; done' : 'stopped'}</div>
        `;
        list.appendChild(row);
      });
    }

    loadTodaySessions();
  </script>
</body>
</html>
