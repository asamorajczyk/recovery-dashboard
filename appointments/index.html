<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Appointments</title>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0e0f11;
      --surface: #161719;
      --surface2: #1e2023;
      --border: #2a2d32;
      --border-bright: #3a3f47;
      --ink: #e8eaed;
      --muted: #6b7280;
      --accent: #e05c1a;
      --accent-dim: #7a2f08;
      --green: #22c55e;
      --yellow: #f59e0b;
    }

    body {
      font-family: 'Rajdhani', sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      padding: 24px 16px 32px;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        repeating-linear-gradient(0deg, transparent, transparent 39px, rgba(255,255,255,0.015) 39px, rgba(255,255,255,0.015) 40px),
        repeating-linear-gradient(90deg, transparent, transparent 39px, rgba(255,255,255,0.015) 39px, rgba(255,255,255,0.015) 40px);
      pointer-events: none;
      z-index: 0;
    }

    .panel {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 460px;
      margin: 0 auto;
    }

    .header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      margin-bottom: 24px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
    }

    .header h1 {
      font-weight: 700;
      font-size: 30px;
      letter-spacing: 3px;
      text-transform: uppercase;
      line-height: 1;
    }

    .header h1 span { color: var(--accent); }

    .header p {
      margin-top: 4px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    .back-link {
      font-family: 'Share Tech Mono', monospace;
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 0.1em;
      text-decoration: none;
      text-transform: uppercase;
    }
    .back-link:active { color: var(--ink); }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }

    /* Appointment cards */
    .appt-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 3px solid var(--border-bright);
      border-radius: 2px;
      padding: 18px 18px 16px;
      margin-bottom: 12px;
    }

    .appt-card.soon   { border-left-color: var(--yellow); }
    .appt-card.urgent { border-left-color: var(--accent); }

    .appt-days {
      font-family: 'Share Tech Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--muted);
      flex-shrink: 0;
      align-self: flex-end;
      padding-bottom: 2px;
    }

    .appt-card.soon   .appt-days { color: var(--yellow); }
    .appt-card.urgent .appt-days { color: var(--accent); }

    .appt-title {
      font-weight: 700;
      font-size: 18px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      line-height: 1;
    }

    .appt-title-row {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin-bottom: 6px;
    }

    .appt-datetime {
      font-family: 'Share Tech Mono', monospace;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 14px;
    }

    .sep-mini {
      height: 1px;
      background: var(--border);
      margin: 12px 0;
    }

    .detail-row {
      display: flex;
      flex-direction: column;
      gap: 2px;
      margin-bottom: 10px;
    }

    .detail-label {
      font-family: 'Share Tech Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--border-bright);
    }

    .detail-value {
      font-family: 'Share Tech Mono', monospace;
      font-size: 12px;
      color: var(--ink);
      line-height: 1.5;
    }

    .maps-link {
      display: inline-block;
      margin-top: 6px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.1em;
      color: var(--accent);
      text-decoration: none;
      text-transform: uppercase;
      border-bottom: 1px solid var(--accent-dim);
      padding-bottom: 1px;
    }

    .no-appts {
      font-family: 'Share Tech Mono', monospace;
      font-size: 12px;
      color: var(--border-bright);
      padding: 16px 0;
    }

    .footer {
      margin-top: 20px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 9px;
      color: var(--border-bright);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="panel">

    <div class="header">
      <div>
        <h1>APPOINT<span>MENTS</span></h1>
        <p>Upcoming schedule</p>
      </div>
      <a class="back-link" href="../dashboard/index.html">&#9664; return to dashboard</a>
    </div>

    <div id="appt-list"></div>

    <div class="footer" id="footer">—</div>

  </div>

  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzlX9lSgCYNm4qc1pYUEz-VWnjVSoCjhAgXCLPbKyMG4RbwyT7fn-Ks0xGf6JHF-8lc/exec';

    function parseDate(dateStr) {
      const [yr, mo, dy] = (dateStr || '').split('-').map(Number);
      return new Date(yr, mo - 1, dy);
    }

    function daysUntil(dateStr) {
      const appt  = parseDate(dateStr);
      const today = new Date(); today.setHours(0,0,0,0);
      return Math.round((appt - today) / 86400000);
    }

    function formatDate(dateStr) {
      return parseDate(dateStr).toLocaleDateString('en-US', {
        weekday: 'long', month: 'long', day: 'numeric', year: 'numeric'
      });
    }

    async function loadAppointments() {
      try {
        const res   = await fetch(`${SCRIPT_URL}?action=getAppointments`);
        const appts = await res.json();

        const list = document.getElementById('appt-list');
        list.innerHTML = '';

        if (!appts.length) {
          list.innerHTML = '<div class="no-appts">// no upcoming appointments</div>';
          return;
        }

        appts.forEach(appt => {
          const days     = daysUntil(appt.date);
          const daysStr  = days === 0 ? 'today' : days === 1 ? 'tomorrow' : `in ${days} days`;
          const urgency  = days <= 1 ? 'urgent' : days <= 7 ? 'soon' : '';
          const hasNotes = appt.notes && appt.notes !== 'undefined' && appt.notes.trim() !== '';

          const card = document.createElement('div');
          card.className = `appt-card ${urgency}`;

          card.innerHTML = `
            <div class="appt-title-row">
              <div class="appt-title">${appt.title}</div>
              <div class="appt-days">// ${daysStr}</div>
            </div>
            <div class="appt-datetime">${formatDate(appt.date)}${appt.time ? ' &middot; ' + appt.time : ''}</div>
            <div class="sep-mini"></div>
            ${appt.location_name ? `
              <div class="detail-row">
                <div class="detail-label">Location</div>
                <div class="detail-value">${appt.location_name}</div>
              </div>` : ''}
            ${hasNotes ? `
              <div class="sep-mini"></div>
              <div class="detail-row">
                <div class="detail-label">Notes / what to bring</div>
                <div class="detail-value">${appt.notes}</div>
              </div>` : ''}
          `;

          list.appendChild(card);
        });

        document.getElementById('footer').textContent =
          `updated ${new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }).toLowerCase()} · managed via google sheet`;

      } catch (err) {
        document.getElementById('appt-list').innerHTML =
          '<div class="no-appts" style="color:var(--accent)">// ERR: could not load appointments</div>';
      }
    }

    loadAppointments();
  </script>
</body>
</html>
