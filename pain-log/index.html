<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pain Log</title>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0e0f11;
      --surface: #161719;
      --surface2: #1e2023;
      --border: #2a2d32;
      --border-bright: #3a3f47;
      --ink: #e8eaed;
      --muted: #6b7280;
      --accent: #e05c1a;
      --green: #22c55e;
      --yellow: #f59e0b;
      --red: #ef4444;
    }

    body {
      font-family: 'Rajdhani', sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      padding: 24px 16px 40px;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        repeating-linear-gradient(0deg, transparent, transparent 39px, rgba(255,255,255,0.015) 39px, rgba(255,255,255,0.015) 40px),
        repeating-linear-gradient(90deg, transparent, transparent 39px, rgba(255,255,255,0.015) 39px, rgba(255,255,255,0.015) 40px);
      pointer-events: none;
      z-index: 0;
    }

    .panel {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 460px;
      margin: 0 auto;
    }

    .header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      margin-bottom: 28px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
    }

    .header h1 {
      font-weight: 700;
      font-size: 30px;
      letter-spacing: 3px;
      text-transform: uppercase;
      line-height: 1;
    }

    .header h1 span { color: var(--accent); }
    .header p {
      margin-top: 4px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    .status-dot {
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 0.1em;
    }

    .status-dot::before {
      content: '';
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 6px var(--green);
      animation: blink 2.5s ease-in-out infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }

    /* Scale note */
    .scale-note {
      font-family: 'Share Tech Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: 8px;
      margin-bottom: 20px;
    }

    /* Number grid */
    .pain-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
    }

    .pain-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 64px;
      border: none;
      border-radius: 2px;
      font-family: 'Rajdhani', sans-serif;
      font-size: 28px;
      font-weight: 700;
      color: #fff;
      cursor: pointer;
      transition: transform 0.08s, filter 0.15s;
      -webkit-tap-highlight-color: transparent;
      position: relative;
      overflow: hidden;
    }

    .pain-btn:active { transform: scale(0.94); filter: brightness(1.2); }

    .pain-btn.loading { filter: brightness(0.6); pointer-events: none; }

    .pain-btn[data-score="1"]  { background: #16a34a; }
    .pain-btn[data-score="2"]  { background: #22c55e; }
    .pain-btn[data-score="3"]  { background: #84cc16; }
    .pain-btn[data-score="4"]  { background: #eab308; }
    .pain-btn[data-score="5"]  { background: #f59e0b; }
    .pain-btn[data-score="6"]  { background: #f97316; }
    .pain-btn[data-score="7"]  { background: #e05c1a; }
    .pain-btn[data-score="8"]  { background: #dc2626; }
    .pain-btn[data-score="9"]  { background: #b91c1c; }
    .pain-btn[data-score="10"] { background: #7f1d1d; font-size: 22px; }

    /* Toast */
    .toast {
      display: none;
      padding: 12px 14px;
      border-radius: 2px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.06em;
      margin-bottom: 20px;
      border: 1px solid transparent;
    }

    .toast.success { display: block; background: rgba(34,197,94,0.08); color: var(--green); border-color: #166534; }
    .toast.error   { display: block; background: rgba(224,92,26,0.08); color: var(--accent); border-color: #7a2f08; }

    /* Average */
    .avg-row {
      display: flex;
      align-items: baseline;
      gap: 10px;
      padding: 14px 0;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      margin-bottom: 20px;
    }

    .avg-label {
      font-family: 'Share Tech Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--border-bright);
    }

    .avg-value {
      font-family: 'Share Tech Mono', monospace;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.05em;
    }

    .avg-count {
      font-family: 'Share Tech Mono', monospace;
      font-size: 10px;
      color: var(--muted);
      margin-left: auto;
    }

    /* Avg bar */
    .avg-bar-bg {
      height: 4px;
      background: var(--surface2);
      border-radius: 2px;
      overflow: hidden;
      margin-top: -10px;
      margin-bottom: 20px;
    }

    .avg-bar { height: 4px; border-radius: 2px; transition: width 0.5s, background 0.5s; }

    /* Log section */
    .section-label {
      font-family: 'Share Tech Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--border-bright);
      margin-bottom: 10px;
    }

    .log-list { display: flex; flex-direction: column; gap: 6px; }

    .log-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 2px;
    }

    .log-time {
      font-family: 'Share Tech Mono', monospace;
      font-size: 11px;
      color: var(--muted);
      flex: 1;
    }

    .log-score {
      font-family: 'Share Tech Mono', monospace;
      font-size: 16px;
      font-weight: 700;
      width: 36px;
      text-align: center;
      padding: 4px 0;
      border-radius: 2px;
    }

    /* Note field */
    .note-wrap {
      margin-bottom: 14px;
    }

    .note-label {
      font-family: 'Share Tech Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--border-bright);
      margin-bottom: 6px;
    }

    .note-field {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 2px;
      outline: none;
      font-family: 'Share Tech Mono', monospace;
      font-size: 12px;
      color: var(--ink);
      padding: 10px 12px;
      resize: none;
      height: 58px;
      line-height: 1.6;
      transition: border-color 0.15s;
    }

    .note-field:focus { border-color: var(--accent); }
    .note-field::placeholder { color: var(--border); }

    .no-entries {
      font-family: 'Share Tech Mono', monospace;
      font-size: 11px;
      color: var(--border-bright);
    }

    .log-note {
      font-family: 'Share Tech Mono', monospace;
      font-size: 10px;
      color: var(--muted);
      margin-top: 4px;
      line-height: 1.5;
    }

    .footer {
      margin-top: 24px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 9px;
      color: var(--border-bright);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="panel">

    <div class="header">
      <div>
        <h1>PAIN <span>LOG</span></h1>
        <p>How are you feeling?</p>
      </div>
      <div class="status-dot">LIVE</div>
    </div>

    <div class="note-wrap">
      <div class="note-label">// note (optional)</div>
      <textarea class="note-field" id="note-field" placeholder="describe what's going on..."></textarea>
    </div>

    <div class="pain-grid" id="pain-grid">
      <button class="pain-btn" data-score="1"  onclick="logPain(1)">1</button>
      <button class="pain-btn" data-score="2"  onclick="logPain(2)">2</button>
      <button class="pain-btn" data-score="3"  onclick="logPain(3)">3</button>
      <button class="pain-btn" data-score="4"  onclick="logPain(4)">4</button>
      <button class="pain-btn" data-score="5"  onclick="logPain(5)">5</button>
      <button class="pain-btn" data-score="6"  onclick="logPain(6)">6</button>
      <button class="pain-btn" data-score="7"  onclick="logPain(7)">7</button>
      <button class="pain-btn" data-score="8"  onclick="logPain(8)">8</button>
      <button class="pain-btn" data-score="9"  onclick="logPain(9)">9</button>
      <button class="pain-btn" data-score="10" onclick="logPain(10)">10</button>
    </div>

    <div class="scale-note">// 1 = minimal &nbsp;&middot;&nbsp; 5 = moderate &nbsp;&middot;&nbsp; 10 = extreme</div>

    <div class="toast" id="toast"></div>

    <div class="avg-row" id="avg-row" style="display:none">
      <div class="avg-label">Avg today</div>
      <div class="avg-value" id="avg-value">—</div>
      <div class="avg-count" id="avg-count">—</div>
    </div>
    <div class="avg-bar-bg" id="avg-bar-bg" style="display:none">
      <div class="avg-bar" id="avg-bar"></div>
    </div>

    <div class="section-label">// today's log</div>
    <div class="log-list" id="log-list">
      <div class="no-entries">loading...</div>
    </div>

    <div class="footer" id="footer">—</div>

  </div>

  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzlX9lSgCYNm4qc1pYUEz-VWnjVSoCjhAgXCLPbKyMG4RbwyT7fn-Ks0xGf6JHF-8lc/exec';

    const SCORE_COLORS = {
      1: '#16a34a', 2: '#22c55e', 3: '#84cc16',
      4: '#eab308', 5: '#f59e0b', 6: '#f97316',
      7: '#e05c1a', 8: '#dc2626', 9: '#b91c1c', 10: '#7f1d1d'
    };

    function scoreColor(s) {
      return SCORE_COLORS[Math.min(10, Math.max(1, Math.round(s)))] || '#e05c1a';
    }

    function fmtTime(ts) {
      return new Date(ts).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
    }

    let logging = false;

    async function logPain(score) {
      if (logging) return;
      logging = true;

      const btns  = document.querySelectorAll('.pain-btn');
      const toast = document.getElementById('toast');
      const note  = document.getElementById('note-field').value.trim();
      btns.forEach(b => b.classList.add('loading'));
      toast.className = 'toast';

      try {
        const url = `${SCRIPT_URL}?action=logPain&score=${score}&notes=${encodeURIComponent(note)}`;
        const res  = await fetch(url);
        const data = await res.json();

        if (data.error) throw new Error(data.error);

        document.getElementById('note-field').value = '';
        toast.textContent = `// OK: logged ${score}/10`;
        toast.className = 'toast success';
        await loadToday();

      } catch (err) {
        toast.textContent = `// ERR: could not log — try again`;
        toast.className = 'toast error';
      }

      btns.forEach(b => b.classList.remove('loading'));
      logging = false;

      setTimeout(() => { toast.className = 'toast'; }, 4000);
    }

    async function loadToday() {
      try {
        const res  = await fetch(`${SCRIPT_URL}?action=getTodayPain`);
        const data = await res.json();

        const list = document.getElementById('log-list');

        if (!data.entries || data.entries.length === 0) {
          list.innerHTML = '<div class="no-entries">// no entries today</div>';
          document.getElementById('avg-row').style.display = 'none';
          document.getElementById('avg-bar-bg').style.display = 'none';
          return;
        }

        list.innerHTML = '';
        // Show newest first
        [...data.entries].reverse().forEach(entry => {
          const row = document.createElement('div');
          row.className = 'log-row';
          row.style.flexDirection = 'column';
          row.style.alignItems = 'flex-start';
          row.innerHTML = `
            <div style="display:flex;align-items:center;gap:12px;width:100%">
              <div class="log-time">${fmtTime(entry.timestamp)}</div>
              <div class="log-score" style="background:${scoreColor(entry.score)}22;color:${scoreColor(entry.score)}">${entry.score}/10</div>
            </div>
            ${entry.notes ? `<div class="log-note">${entry.notes}</div>` : ''}
          `;
          list.appendChild(row);
        });

        if (data.average !== null) {
          const avgRow = document.getElementById('avg-row');
          avgRow.style.display = 'flex';
          document.getElementById('avg-value').textContent = data.average + '/10';
          document.getElementById('avg-value').style.color = scoreColor(data.average);
          document.getElementById('avg-count').textContent = `${data.entries.length} entr${data.entries.length === 1 ? 'y' : 'ies'}`;

          const barBg = document.getElementById('avg-bar-bg');
          barBg.style.display = 'block';
          const bar = document.getElementById('avg-bar');
          bar.style.width = (data.average / 10 * 100) + '%';
          bar.style.background = scoreColor(data.average);
        }

        document.getElementById('footer').textContent =
          `updated ${new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }).toLowerCase()} · managed via google sheet`;

      } catch (err) {
        document.getElementById('log-list').innerHTML =
          '<div class="no-entries" style="color:var(--accent)">// ERR: could not load</div>';
      }
    }

    loadToday();
  </script>
</body>
</html>
