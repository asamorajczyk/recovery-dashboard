<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Milestones</title>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0e0f11;
      --surface: #161719;
      --surface2: #1e2023;
      --border: #2a2d32;
      --border-bright: #3a3f47;
      --ink: #e8eaed;
      --muted: #6b7280;
      --accent: #e05c1a;
      --accent-dim: #7a2f08;
      --green: #22c55e;
      --green-dim: rgba(34,197,94,0.08);
      --yellow: #f59e0b;
    }

    body {
      font-family: 'Rajdhani', sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      padding: 24px 16px 40px;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        repeating-linear-gradient(0deg, transparent, transparent 39px, rgba(255,255,255,0.015) 39px, rgba(255,255,255,0.015) 40px),
        repeating-linear-gradient(90deg, transparent, transparent 39px, rgba(255,255,255,0.015) 39px, rgba(255,255,255,0.015) 40px);
      pointer-events: none;
      z-index: 0;
    }

    .panel {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 460px;
      margin: 0 auto;
    }

    .header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      margin-bottom: 24px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
    }

    .header h1 {
      font-weight: 700;
      font-size: 30px;
      letter-spacing: 3px;
      text-transform: uppercase;
      line-height: 1;
    }

    .header h1 span { color: var(--accent); }

    .header p {
      margin-top: 4px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    .back-link {
      font-family: 'Share Tech Mono', monospace;
      font-size: 10px;
      color: var(--muted);
      text-decoration: none;
      letter-spacing: 0.1em;
    }

    /* Progress summary */
    .progress-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-top: 2px solid var(--accent);
      border-radius: 2px;
      padding: 16px 18px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .progress-left { flex: 1; }

    .progress-label {
      font-family: 'Share Tech Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--border-bright);
      margin-bottom: 8px;
    }

    .progress-bar-bg {
      height: 5px;
      background: var(--surface2);
      border-radius: 2px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 5px;
      border-radius: 2px;
      background: var(--accent);
      transition: width 0.6s ease;
    }

    .progress-nums {
      font-family: 'Share Tech Mono', monospace;
      font-size: 28px;
      font-weight: 700;
      color: var(--ink);
      margin-left: 20px;
      white-space: nowrap;
    }

    .progress-nums span { color: var(--muted); font-size: 16px; }

    /* Section header */
    .section-label {
      font-family: 'Share Tech Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--border-bright);
      margin-bottom: 10px;
      margin-top: 20px;
    }

    .section-label:first-of-type { margin-top: 0; }

    /* Timeline */
    .timeline { display: flex; flex-direction: column; gap: 6px; }

    .milestone-row {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 2px;
      padding: 14px 16px;
    }

    .milestone-row.next {
      border-left: 3px solid var(--accent);
    }

    .milestone-row.passed {
      opacity: 0.55;
    }

    /* Date column */
    .milestone-date-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex-shrink: 0;
      width: 42px;
    }

    .milestone-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      border: 2px solid var(--border-bright);
      background: var(--bg);
      margin-bottom: 5px;
      flex-shrink: 0;
    }

    .milestone-row.passed .milestone-dot {
      background: var(--green);
      border-color: var(--green);
    }

    .milestone-row.next .milestone-dot {
      background: var(--accent);
      border-color: var(--accent);
      box-shadow: 0 0 6px var(--accent);
    }

    .milestone-day {
      font-family: 'Share Tech Mono', monospace;
      font-size: 15px;
      font-weight: 700;
      color: var(--ink);
      line-height: 1;
    }

    .milestone-month {
      font-family: 'Share Tech Mono', monospace;
      font-size: 8px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: 2px;
    }

    /* Body */
    .milestone-body { flex: 1; min-width: 0; }

    .milestone-name {
      font-weight: 600;
      font-size: 16px;
      letter-spacing: 0.5px;
      line-height: 1.2;
    }

    .milestone-meta {
      font-family: 'Share Tech Mono', monospace;
      font-size: 9px;
      color: var(--muted);
      letter-spacing: 0.08em;
      margin-top: 4px;
    }

    .milestone-meta .upcoming { color: var(--accent); }
    .milestone-meta .achieved { color: var(--green); }
    .milestone-meta .today    { color: var(--yellow); }

    .milestone-notes {
      font-family: 'Share Tech Mono', monospace;
      font-size: 10px;
      color: var(--muted);
      margin-top: 6px;
      line-height: 1.5;
      border-top: 1px solid var(--border);
      padding-top: 6px;
    }

    .empty-state {
      font-family: 'Share Tech Mono', monospace;
      font-size: 11px;
      color: var(--border-bright);
      padding: 20px 0;
    }

    .footer {
      margin-top: 24px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 9px;
      color: var(--border-bright);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="panel">

    <div class="header">
      <div>
        <h1>MILE<span>STONES</span></h1>
        <p>Recovery timeline</p>
      </div>
      <a class="back-link" href="../dashboard/index.html">&#9664; back</a>
    </div>

    <div class="progress-card" id="progress-card">
      <div class="progress-left">
        <div class="progress-label">// milestones reached</div>
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" id="progress-bar" style="width:0%"></div>
        </div>
      </div>
      <div class="progress-nums" id="progress-nums">— <span>/ —</span></div>
    </div>

    <div id="milestones-container">
      <div class="empty-state">loading...</div>
    </div>

    <div class="footer" id="footer">add milestones in the google sheet · milestones tab</div>

  </div>

  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzlX9lSgCYNm4qc1pYUEz-VWnjVSoCjhAgXCLPbKyMG4RbwyT7fn-Ks0xGf6JHF-8lc/exec';

    function todayStr() {
      const d = new Date();
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${dd}`;
    }

    function daysFrom(dateStr) {
      const today = new Date(); today.setHours(0,0,0,0);
      const target = new Date(dateStr + 'T00:00:00');
      return Math.round((target - today) / 86400000);
    }

    function fmtRelative(days) {
      if (days === 0)  return 'today';
      if (days === 1)  return 'tomorrow';
      if (days === -1) return 'yesterday';
      if (days > 0)    return `in ${days} days`;
      return `${Math.abs(days)} days ago`;
    }

    function render(milestones) {
      const container = document.getElementById('milestones-container');
      container.innerHTML = '';

      if (!milestones.length) {
        container.innerHTML = '<div class="empty-state">// no milestones — add them to the Milestones sheet</div>';
        return;
      }

      const today = todayStr();
      const passed   = milestones.filter(m => m.date && m.date < today);
      const upcoming = milestones.filter(m => m.date && m.date >= today);
      const noDate   = milestones.filter(m => !m.date);

      const passed_count   = passed.length;
      const total_with_date = passed.length + upcoming.length;

      // Progress
      const pct = total_with_date > 0 ? Math.round(passed_count / total_with_date * 100) : 0;
      document.getElementById('progress-nums').innerHTML =
        `${passed_count} <span>/ ${total_with_date}</span>`;
      const bar = document.getElementById('progress-bar');
      bar.style.width = pct + '%';
      bar.style.background = pct === 100 ? 'var(--green)' : 'var(--accent)';

      const card = document.getElementById('progress-card');
      card.style.borderTopColor = pct === 100 ? 'var(--green)' : 'var(--accent)';

      function makeRow(m) {
        const days = m.date ? daysFrom(m.date) : null;
        const isPassed = m.date && m.date < today;
        const isNext   = !isPassed && upcoming.indexOf(m) === 0;
        const isToday  = m.date === today;

        const d = m.date ? new Date(m.date + 'T00:00:00') : null;
        const dayNum   = d ? d.getDate() : '—';
        const monthStr = d ? d.toLocaleDateString('en-US', { month: 'short' }).toUpperCase() : '';

        let metaHtml = '';
        if (isToday)            metaHtml = `<span class="today">&#9654; today</span>`;
        else if (isPassed)      metaHtml = `<span class="achieved">&#10003; ${fmtRelative(days)}</span>`;
        else if (days === 1)    metaHtml = `<span class="upcoming">1 day until this milestone</span>`;
        else if (days !== null) metaHtml = `<span class="upcoming">${days} days until this milestone</span>`;

        const row = document.createElement('div');
        row.className = 'milestone-row' + (isPassed ? ' passed' : '') + (isNext ? ' next' : '');
        row.innerHTML = `
          <div class="milestone-date-col">
            <div class="milestone-dot"></div>
            <div class="milestone-day">${dayNum}</div>
            <div class="milestone-month">${monthStr}</div>
          </div>
          <div class="milestone-body">
            <div class="milestone-name">${m.name}</div>
            ${metaHtml ? `<div class="milestone-meta">${metaHtml}</div>` : ''}
            ${m.notes ? `<div class="milestone-notes">${m.notes}</div>` : ''}
          </div>
        `;
        return row;
      }

      // Upcoming section
      if (upcoming.length) {
        const upLabel = document.createElement('div');
        upLabel.className = 'section-label';
        upLabel.textContent = '// upcoming';
        container.appendChild(upLabel);

        const upList = document.createElement('div');
        upList.className = 'timeline';
        upcoming.forEach(m => upList.appendChild(makeRow(m)));
        container.appendChild(upList);
      }

      // Passed section
      if (passed.length) {
        const passLabel = document.createElement('div');
        passLabel.className = 'section-label';
        passLabel.textContent = '// reached';
        container.appendChild(passLabel);

        const passList = document.createElement('div');
        passList.className = 'timeline';
        [...passed].reverse().forEach(m => passList.appendChild(makeRow(m)));
        container.appendChild(passList);
      }

      // No date
      if (noDate.length) {
        const ndLabel = document.createElement('div');
        ndLabel.className = 'section-label';
        ndLabel.textContent = '// no date set';
        container.appendChild(ndLabel);

        const ndList = document.createElement('div');
        ndList.className = 'timeline';
        noDate.forEach(m => ndList.appendChild(makeRow(m)));
        container.appendChild(ndList);
      }
    }

    async function load() {
      try {
        const res  = await fetch(`${SCRIPT_URL}?action=getMilestones`);
        const data = await res.json();
        render(data);
        document.getElementById('footer').textContent =
          `updated ${new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }).toLowerCase()} · managed via milestones sheet`;
      } catch (err) {
        document.getElementById('milestones-container').innerHTML =
          '<div class="empty-state" style="color:var(--accent)">// ERR: could not load</div>';
      }
    }

    load();
  </script>
</body>
</html>
