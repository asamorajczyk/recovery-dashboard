<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Milestones</title>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0e0f11;
      --surface: #161719;
      --surface2: #1e2023;
      --border: #2a2d32;
      --border-bright: #3a3f47;
      --ink: #e8eaed;
      --muted: #6b7280;
      --accent: #e05c1a;
      --accent-dim: #7a2f08;
      --green: #22c55e;
      --green-dim: #14532d;
      --yellow: #f59e0b;
    }

    body {
      font-family: 'Rajdhani', sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      padding: 24px 16px 40px;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        repeating-linear-gradient(0deg, transparent, transparent 39px, rgba(255,255,255,0.015) 39px, rgba(255,255,255,0.015) 40px),
        repeating-linear-gradient(90deg, transparent, transparent 39px, rgba(255,255,255,0.015) 39px, rgba(255,255,255,0.015) 40px);
      pointer-events: none;
      z-index: 0;
    }

    .panel {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 460px;
      margin: 0 auto;
    }

    .header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      margin-bottom: 24px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
    }

    .header h1 {
      font-weight: 700;
      font-size: 30px;
      letter-spacing: 3px;
      text-transform: uppercase;
      line-height: 1;
    }

    .header h1 span { color: var(--accent); }

    .header p {
      margin-top: 4px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    .back-link {
      font-family: 'Share Tech Mono', monospace;
      font-size: 10px;
      color: var(--muted);
      text-decoration: none;
      letter-spacing: 0.1em;
    }

    .back-link:hover { color: var(--ink); }

    /* Progress bar */
    .progress-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-top: 2px solid var(--accent);
      border-radius: 2px;
      padding: 16px 18px;
      margin-bottom: 20px;
    }

    .progress-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .progress-label {
      font-family: 'Share Tech Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--border-bright);
    }

    .progress-count {
      font-family: 'Share Tech Mono', monospace;
      font-size: 20px;
      font-weight: 700;
      color: var(--ink);
    }

    .progress-count span { color: var(--muted); font-size: 13px; }

    .progress-bar-bg {
      height: 6px;
      background: var(--surface2);
      border-radius: 2px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 6px;
      border-radius: 2px;
      background: var(--accent);
      transition: width 0.6s ease;
    }

    /* Category section */
    .category-section { margin-bottom: 24px; }

    .category-label {
      font-family: 'Share Tech Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--border-bright);
      margin-bottom: 8px;
    }

    .milestone-list { display: flex; flex-direction: column; gap: 6px; }

    /* Individual milestone row */
    .milestone-row {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 2px;
      padding: 12px 14px;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      -webkit-tap-highlight-color: transparent;
    }

    .milestone-row:active { background: var(--surface2); }

    .milestone-row.done {
      opacity: 0.6;
    }

    .milestone-row.confirming {
      border-color: var(--yellow);
    }

    .milestone-check {
      width: 22px;
      height: 22px;
      border: 2px solid var(--border-bright);
      border-radius: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 1px;
      font-size: 13px;
      font-weight: 700;
      transition: background 0.2s, border-color 0.2s;
    }

    .milestone-row.done .milestone-check {
      background: var(--green-dim);
      border-color: var(--green);
      color: var(--green);
    }

    .milestone-row.confirming .milestone-check {
      border-color: var(--yellow);
    }

    .milestone-body { flex: 1; min-width: 0; }

    .milestone-name {
      font-weight: 600;
      font-size: 15px;
      letter-spacing: 0.5px;
      line-height: 1.2;
    }

    .milestone-row.done .milestone-name {
      text-decoration: line-through;
      color: var(--muted);
    }

    .milestone-meta {
      font-family: 'Share Tech Mono', monospace;
      font-size: 9px;
      color: var(--muted);
      letter-spacing: 0.1em;
      margin-top: 4px;
    }

    .milestone-meta .achieved { color: var(--green); }
    .milestone-meta .target   { color: var(--border-bright); }
    .milestone-meta .unmark-hint { color: var(--yellow); }

    .milestone-notes {
      font-family: 'Share Tech Mono', monospace;
      font-size: 10px;
      color: var(--muted);
      margin-top: 4px;
      line-height: 1.5;
    }

    /* Toast */
    .toast {
      display: none;
      padding: 12px 14px;
      border-radius: 2px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.06em;
      margin-bottom: 16px;
      border: 1px solid transparent;
    }

    .toast.success { display: block; background: rgba(34,197,94,0.08); color: var(--green); border-color: #166534; }
    .toast.error   { display: block; background: rgba(224,92,26,0.08); color: var(--accent); border-color: var(--accent-dim); }

    .empty-state {
      font-family: 'Share Tech Mono', monospace;
      font-size: 11px;
      color: var(--border-bright);
      padding: 20px 0;
    }

    .footer {
      margin-top: 24px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 9px;
      color: var(--border-bright);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="panel">

    <div class="header">
      <div>
        <h1>MILE<span>STONES</span></h1>
        <p>Jessie's recovery progress</p>
      </div>
      <a class="back-link" href="../dashboard/index.html">&#9664; back</a>
    </div>

    <div class="progress-card" id="progress-card">
      <div class="progress-row">
        <div class="progress-label">// achieved</div>
        <div class="progress-count" id="progress-count">— <span>/ —</span></div>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progress-bar" style="width:0%"></div>
      </div>
    </div>

    <div class="toast" id="toast"></div>

    <div id="milestones-container">
      <div class="empty-state">loading...</div>
    </div>

    <div class="footer" id="footer">add milestones in the google sheet · milestones tab</div>

  </div>

  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzlX9lSgCYNm4qc1pYUEz-VWnjVSoCjhAgXCLPbKyMG4RbwyT7fn-Ks0xGf6JHF-8lc/exec';

    let milestones = [];
    let confirmingId = null;
    let confirmTimer = null;

    function fmtDate(dateStr) {
      if (!dateStr) return null;
      const d = new Date(dateStr + 'T00:00:00');
      return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    }

    function showToast(msg, type) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = 'toast ' + type;
      setTimeout(() => { t.className = 'toast'; }, 4000);
    }

    function updateProgress() {
      const total    = milestones.length;
      const achieved = milestones.filter(m => m.achieved_date).length;
      const pct      = total > 0 ? Math.round(achieved / total * 100) : 0;

      document.getElementById('progress-count').innerHTML =
        `${achieved} <span>/ ${total}</span>`;

      const bar = document.getElementById('progress-bar');
      bar.style.width = pct + '%';
      bar.style.background = pct === 100 ? 'var(--green)' : pct > 0 ? 'var(--accent)' : 'var(--border-bright)';

      const card = document.getElementById('progress-card');
      card.style.borderTopColor = pct === 100 ? 'var(--green)' : 'var(--accent)';
    }

    function render() {
      const container = document.getElementById('milestones-container');
      container.innerHTML = '';

      if (!milestones.length) {
        container.innerHTML = '<div class="empty-state">// no milestones found — add them to the Milestones sheet</div>';
        return;
      }

      // Group by category
      const categories = {};
      milestones.forEach(m => {
        const cat = m.category || 'General';
        if (!categories[cat]) categories[cat] = [];
        categories[cat].push(m);
      });

      // Render incomplete first within each category, then achieved
      Object.entries(categories).forEach(([cat, items]) => {
        const section = document.createElement('div');
        section.className = 'category-section';

        const label = document.createElement('div');
        label.className = 'category-label';
        label.textContent = `// ${cat}`;
        section.appendChild(label);

        const list = document.createElement('div');
        list.className = 'milestone-list';

        const sorted = [...items].sort((a, b) => {
          if (!!a.achieved_date === !!b.achieved_date) return 0;
          return a.achieved_date ? 1 : -1;
        });

        sorted.forEach(m => {
          const row = document.createElement('div');
          row.className = 'milestone-row' + (m.achieved_date ? ' done' : '');
          row.dataset.id = m.id;

          const isConfirming = confirmingId === m.id;

          let metaHtml = '';
          if (m.achieved_date) {
            metaHtml = isConfirming
              ? `<span class="unmark-hint">tap again to unmark</span>`
              : `<span class="achieved">&#10003; achieved ${fmtDate(m.achieved_date)}</span>`;
          } else if (m.target_date) {
            metaHtml = `<span class="target">target: ${fmtDate(m.target_date)}</span>`;
          }

          if (isConfirming) row.classList.add('confirming');

          row.innerHTML = `
            <div class="milestone-check">${m.achieved_date ? '✓' : ''}</div>
            <div class="milestone-body">
              <div class="milestone-name">${m.name}</div>
              ${metaHtml ? `<div class="milestone-meta">${metaHtml}</div>` : ''}
              ${m.notes ? `<div class="milestone-notes">${m.notes}</div>` : ''}
            </div>
          `;

          row.addEventListener('click', () => handleTap(m.id));
          list.appendChild(row);
        });

        section.appendChild(list);
        container.appendChild(section);
      });

      updateProgress();
    }

    async function handleTap(id) {
      const m = milestones.find(x => x.id === id);
      if (!m) return;

      if (m.achieved_date) {
        // Already done — require second tap to unmark
        if (confirmingId === id) {
          clearTimeout(confirmTimer);
          confirmingId = null;
          await unmark(id);
        } else {
          confirmingId = id;
          render();
          confirmTimer = setTimeout(() => {
            confirmingId = null;
            render();
          }, 4000);
        }
      } else {
        await mark(id);
      }
    }

    async function mark(id) {
      try {
        const res  = await fetch(`${SCRIPT_URL}?action=markMilestone&id=${encodeURIComponent(id)}`);
        const data = await res.json();
        if (data.error) throw new Error(data.error);

        const m = milestones.find(x => x.id === id);
        if (m) m.achieved_date = data.achieved_date;

        showToast(`// ✓ milestone achieved!`, 'success');
        render();
      } catch (err) {
        showToast('// ERR: could not save — try again', 'error');
      }
    }

    async function unmark(id) {
      try {
        const res  = await fetch(`${SCRIPT_URL}?action=unmarkMilestone&id=${encodeURIComponent(id)}`);
        const data = await res.json();
        if (data.error) throw new Error(data.error);

        const m = milestones.find(x => x.id === id);
        if (m) m.achieved_date = null;

        showToast('// milestone unmarked', 'success');
        render();
      } catch (err) {
        showToast('// ERR: could not save — try again', 'error');
      }
    }

    async function load() {
      try {
        const res  = await fetch(`${SCRIPT_URL}?action=getMilestones`);
        milestones = await res.json();
        render();
        document.getElementById('footer').textContent =
          `updated ${new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }).toLowerCase()} · managed via milestones sheet`;
      } catch (err) {
        document.getElementById('milestones-container').innerHTML =
          '<div class="empty-state" style="color:var(--accent)">// ERR: could not load milestones</div>';
      }
    }

    load();
  </script>
</body>
</html>
