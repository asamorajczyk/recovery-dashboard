<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Milestones</title>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0e0f11;
      --surface: #161719;
      --surface2: #1e2023;
      --border: #2a2d32;
      --border-bright: #3a3f47;
      --ink: #e8eaed;
      --muted: #6b7280;
      --accent: #e05c1a;
      --accent-dim: #7a2f08;
      --green: #22c55e;
      --green-dim: rgba(34,197,94,0.08);
      --yellow: #f59e0b;
    }

    body {
      font-family: 'Rajdhani', sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      padding: 24px 16px 40px;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        repeating-linear-gradient(0deg, transparent, transparent 39px, rgba(255,255,255,0.015) 39px, rgba(255,255,255,0.015) 40px),
        repeating-linear-gradient(90deg, transparent, transparent 39px, rgba(255,255,255,0.015) 39px, rgba(255,255,255,0.015) 40px);
      pointer-events: none;
      z-index: 0;
    }

    .panel {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 460px;
      margin: 0 auto;
    }

    .header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      margin-bottom: 24px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
    }

    .header h1 {
      font-weight: 700;
      font-size: 30px;
      letter-spacing: 3px;
      text-transform: uppercase;
      line-height: 1;
    }

    .header h1 span { color: var(--accent); }

    .header p {
      margin-top: 4px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    .back-link {
      font-family: 'Share Tech Mono', monospace;
      font-size: 10px;
      color: var(--muted);
      text-decoration: none;
      letter-spacing: 0.1em;
    }
    .back-link:active { color: var(--ink); }

    /* Progress summary */
    .progress-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-top: 2px solid var(--accent);
      border-radius: 2px;
      padding: 16px 18px;
      margin-bottom: 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .progress-left { flex: 1; }

    .progress-label {
      font-family: 'Share Tech Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--border-bright);
      margin-bottom: 8px;
    }

    .progress-bar-bg {
      height: 5px;
      background: var(--surface2);
      border-radius: 2px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 5px;
      border-radius: 2px;
      background: var(--accent);
      transition: width 0.6s ease;
    }

    .progress-nums {
      font-family: 'Share Tech Mono', monospace;
      font-size: 28px;
      font-weight: 700;
      color: var(--ink);
      margin-left: 20px;
      white-space: nowrap;
    }

    .progress-nums span { color: var(--muted); font-size: 16px; }

    /* Section header */
    .section-label {
      font-family: 'Share Tech Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--border-bright);
      margin-bottom: 14px;
      margin-top: 24px;
    }

    /* Timeline */
    .timeline { display: flex; flex-direction: column; }

    /* Timeline row */
    .milestone-row {
      display: flex;
      align-items: stretch;
    }

    /* Date column — left of spine */
    .milestone-date-col {
      width: 44px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      padding-right: 12px;
      padding-top: 10px;
    }

    .milestone-day {
      font-family: 'Share Tech Mono', monospace;
      font-size: 14px;
      font-weight: 700;
      color: var(--ink);
      line-height: 1;
    }

    .milestone-month {
      font-family: 'Share Tech Mono', monospace;
      font-size: 8px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: 2px;
    }

    /* Spine — the vertical bar + dot */
    .milestone-spine {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 18px;
      flex-shrink: 0;
    }

    .spine-top {
      width: 2px;
      height: 11px;
      flex-shrink: 0;
      border-radius: 1px;
    }

    .milestone-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      border: 2px solid var(--border-bright);
      background: var(--bg);
      flex-shrink: 0;
      position: relative;
      z-index: 1;
    }

    .spine-bottom {
      width: 2px;
      flex: 1;
      min-height: 28px;
      border-radius: 1px;
    }

    /* Content — right of spine */
    .milestone-body {
      flex: 1;
      min-width: 0;
      padding: 6px 0 18px 14px;
    }

    .milestone-name {
      font-weight: 600;
      font-size: 16px;
      letter-spacing: 0.5px;
      line-height: 1.2;
    }

    .milestone-meta {
      font-family: 'Share Tech Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.08em;
      margin-top: 4px;
    }

    .milestone-notes {
      font-family: 'Share Tech Mono', monospace;
      font-size: 10px;
      color: var(--muted);
      margin-top: 6px;
      line-height: 1.5;
      border-top: 1px solid var(--border);
      padding-top: 6px;
    }

    .empty-state {
      font-family: 'Share Tech Mono', monospace;
      font-size: 11px;
      color: var(--border-bright);
      padding: 20px 0;
    }

    .footer {
      margin-top: 24px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 9px;
      color: var(--border-bright);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="panel">

    <div class="header">
      <div>
        <h1>MILE<span>STONES</span></h1>
        <p>Recovery timeline</p>
      </div>
      <a class="back-link" href="../dashboard/index.html">&#9664; return to dashboard</a>
    </div>

    <div class="progress-card" id="progress-card">
      <div class="progress-left">
        <div class="progress-label">// milestones reached</div>
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" id="progress-bar" style="width:0%"></div>
        </div>
      </div>
      <div class="progress-nums" id="progress-nums">— <span>/ —</span></div>
    </div>

    <div id="milestones-container">
      <div class="empty-state">loading...</div>
    </div>

    <div class="footer" id="footer">add milestones in the google sheet · milestones tab</div>

  </div>

  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzlX9lSgCYNm4qc1pYUEz-VWnjVSoCjhAgXCLPbKyMG4RbwyT7fn-Ks0xGf6JHF-8lc/exec';

    function todayStr() {
      const d = new Date();
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${dd}`;
    }

    function daysFrom(dateStr) {
      const today = new Date(); today.setHours(0,0,0,0);
      const target = new Date(dateStr + 'T00:00:00');
      return Math.round((target - today) / 86400000);
    }

    function fmtRelative(days) {
      if (days === 0)  return 'today';
      if (days === 1)  return 'tomorrow';
      if (days === -1) return 'yesterday';
      if (days > 0)    return `in ${days} days`;
      return `${Math.abs(days)} days ago`;
    }

    function milestoneColor(days, isPassed) {
      if (isPassed)           return 'var(--green)';
      if (days === null)      return 'var(--border-bright)';
      if (days <= 7)          return 'var(--accent)';
      if (days <= 21)         return 'var(--yellow)';
      return 'var(--border-bright)';
    }

    function makeRow(m, isFirst, isLast, isNext, today, ownColor, nextColor) {
      const days     = daysFrom(m.date);
      const isPassed = m.date < today;

      const d        = new Date(m.date + 'T00:00:00');
      const dayNum   = d.getDate();
      const monthStr = d.toLocaleDateString('en-US', { month: 'short' }).toUpperCase();

      const topBg = isFirst ? 'transparent' : ownColor;
      const botBg = isLast  ? 'transparent' : nextColor;

      const glowStyle = isNext ? `;box-shadow:0 0 8px ${ownColor}` : '';
      const dotStyle  = isPassed
        ? `background:${ownColor};border-color:${ownColor}`
        : `background:var(--bg);border-color:${ownColor}${glowStyle}`;

      const nameStyle = isPassed ? 'color:var(--muted)' : '';
      const dayStyle  = isPassed ? 'color:var(--muted)' : '';

      let metaHtml = '';
      if (isPassed)         metaHtml = `<span style="color:var(--green)">&#10003; ${fmtRelative(days)}</span>`;
      else                  metaHtml = `<span style="color:${ownColor}">${fmtRelative(days)}</span>`;

      const row = document.createElement('div');
      row.className = 'milestone-row';
      row.innerHTML = `
        <div class="milestone-date-col">
          <div class="milestone-day" style="${dayStyle}">${dayNum}</div>
          <div class="milestone-month">${monthStr}</div>
        </div>
        <div class="milestone-spine">
          <div class="spine-top" style="background:${topBg}"></div>
          <div class="milestone-dot" style="${dotStyle}"></div>
          <div class="spine-bottom" style="background:${botBg}"></div>
        </div>
        <div class="milestone-body">
          <div class="milestone-name" style="${nameStyle}">${m.name}</div>
          <div class="milestone-meta">${metaHtml}</div>
          ${m.notes ? `<div class="milestone-notes">${m.notes}</div>` : ''}
        </div>
      `;
      return row;
    }

    function render(milestones) {
      const container = document.getElementById('milestones-container');
      container.innerHTML = '';

      if (!milestones.length) {
        container.innerHTML = '<div class="empty-state">// no milestones — add them to the Milestones sheet</div>';
        return;
      }

      const today    = todayStr();
      const withDate = milestones.filter(m => m.date).sort((a, b) => a.date.localeCompare(b.date));
      const noDate   = milestones.filter(m => !m.date);

      const passed   = withDate.filter(m => m.date < today);
      const upcoming = withDate.filter(m => m.date >= today);

      // Progress bar
      const pct = withDate.length > 0 ? Math.round(passed.length / withDate.length * 100) : 0;
      document.getElementById('progress-nums').innerHTML = `${passed.length} <span>/ ${withDate.length}</span>`;
      const bar = document.getElementById('progress-bar');
      bar.style.width = pct + '%';
      bar.style.background = pct === 100 ? 'var(--green)' : 'var(--accent)';
      document.getElementById('progress-card').style.borderTopColor = pct === 100 ? 'var(--green)' : 'var(--accent)';

      // Pre-compute colors
      const colors = withDate.map(m => milestoneColor(daysFrom(m.date), m.date < today));

      const timeline = document.createElement('div');
      timeline.className = 'timeline';

      withDate.forEach((m, i) => {
        const isFirst  = i === 0;
        const isLast   = i === withDate.length - 1;
        const isNext   = upcoming.length > 0 && m === upcoming[0];
        const ownColor  = colors[i];
        const nextColor = isLast ? 'transparent' : colors[i + 1];
        timeline.appendChild(makeRow(m, isFirst, isLast, isNext, today, ownColor, nextColor));
      });

      container.appendChild(timeline);

      // No-date items
      if (noDate.length) {
        const ndLabel = document.createElement('div');
        ndLabel.className = 'section-label';
        ndLabel.textContent = '// no date set';
        container.appendChild(ndLabel);

        const ndList = document.createElement('div');
        ndList.className = 'timeline';
        noDate.forEach((m, i) => {
          const row = document.createElement('div');
          row.className = 'milestone-row';
          row.innerHTML = `
            <div class="milestone-date-col">
              <div class="milestone-day" style="color:var(--border-bright)">—</div>
            </div>
            <div class="milestone-spine">
              <div class="spine-top" style="background:${i === 0 ? 'transparent' : 'var(--border-bright)'}"></div>
              <div class="milestone-dot" style="background:var(--bg);border-color:var(--border-bright)"></div>
              <div class="spine-bottom" style="background:${i === noDate.length - 1 ? 'transparent' : 'var(--border-bright)'}"></div>
            </div>
            <div class="milestone-body">
              <div class="milestone-name" style="color:var(--muted)">${m.name}</div>
              ${m.notes ? `<div class="milestone-notes">${m.notes}</div>` : ''}
            </div>
          `;
          ndList.appendChild(row);
        });
        container.appendChild(ndList);
      }
    }

    async function load() {
      try {
        const res  = await fetch(`${SCRIPT_URL}?action=getMilestones`);
        const data = await res.json();
        render(data);
        document.getElementById('footer').textContent =
          `updated ${new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }).toLowerCase()} · managed via milestones sheet`;
      } catch (err) {
        document.getElementById('milestones-container').innerHTML =
          '<div class="empty-state" style="color:var(--accent)">// ERR: could not load</div>';
      }
    }

    load();
  </script>
</body>
</html>
